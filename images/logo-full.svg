  <text font-family="Pretendard Variable, Pretendard, -apple-system, sans-serif" font-weight="600" font-size="6.4" fill="#1e3a6e" letter-spacing="0.6" text-anchor="middle"><textPath href="#sgh-arc-bot" startOffset="50%">스터디 가이드 허브</textPath></text>
