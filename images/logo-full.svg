<!-- Study Guide Hub — 엠블럼 전체(링 + 곡선 글자 + 졸업모자).
     ⚠ 글자를 <text>로 두었으므로 Pretendard가 로드된 환경에서만 의도한 자간이 나온다.
        웹에서는 문제없고, 인쇄·외부 납품이 필요하면 글자를 윤곽선으로 변환해서 쓸 것. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="192" height="192" fill="none" role="img" aria-label="Study Guide Hub 스터디 가이드 허브">
